<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rifas PrestaYa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Allura&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f4b; --navy2:#13306d; --navy3:#1c3f8a;
  --green:#1fbf6a; --green2:#16a159; --gold:#ffc83d; --red:#ff4d5e; --orange:#ff9f1c;
  --bg:#eef2f9; --card:#ffffff; --text:#13203d; --muted:#6b7794; --line:#e2e8f3;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button,a,.num,.chip,label{touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px!important}
.hidden{display:none!important}

/* HEADER */
.top{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(31,191,106,.18)}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand .logo{font-weight:900;font-size:26px;letter-spacing:-.5px}
.brand .logo b{color:var(--green)}
.brand .tag{background:var(--gold);color:var(--navy);font-weight:800;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
.top .sub{opacity:.8;font-size:13px;margin-top:4px;position:relative;z-index:1}
.top .actions{position:absolute;right:14px;top:calc(16px + env(safe-area-inset-top));display:flex;gap:6px;z-index:2}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;display:grid;place-items:center}
.ver{font-size:10px;opacity:.6;margin-top:2px;position:relative;z-index:1}

.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 18px rgba(11,31,75,.07);margin-bottom:14px}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted);font-size:13px}

.btn{background:var(--green);color:#fff;font-weight:700;padding:13px 18px;border-radius:14px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.navy{background:var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#eef2f9;color:var(--navy)}
.btn.red{background:var(--red)}
.btn.wa{background:#25d366}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* LISTA RIFAS */
.rifa-item{display:flex;gap:12px;align-items:center;cursor:pointer}
.rifa-badge{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.1;flex-shrink:0}
.rifa-badge b{font-size:20px;display:block}
.rifa-item .info{flex:1;min-width:0}
.rifa-item .info h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;background:#e8edf6;border-radius:8px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:8px}
.empty{text-align:center;padding:40px 20px}
.empty .big{font-size:56px}

.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--green);color:#fff;font-weight:800;padding:15px 20px;border-radius:30px;box-shadow:0 8px 24px rgba(31,191,106,.45);font-size:15px;z-index:40}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#f4f7fc;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.stat.g b{color:var(--green2)} .stat.o b{color:var(--orange)} .stat.n b{color:var(--navy3)}

/* TABS */
.tabs{display:flex;background:#e3e9f4;border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}
.tabs button{flex:1;background:none;padding:10px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.06)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:#fff;border:1.5px solid var(--line);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.grid.c2{grid-template-columns:repeat(5,1fr)}
.num{aspect-ratio:1/1;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:16px;color:var(--navy);display:grid;place-items:center;position:relative;transition:transform .1s}
.grid.c4 .num{font-size:14px;aspect-ratio:1.15/1}
.num:active{transform:scale(.93)}
.num.r{background:#fff4e0;border-color:var(--orange);color:#b86a00}
.num.p{background:var(--green);border-color:var(--green);color:#fff}
.num.x{background:#ffe3e6;border-color:#ff9aa5;color:#c62839}
.num.x::after{content:"🔒";position:absolute;top:2px;right:3px;font-size:9px;line-height:1}
.only-free .num.x,.only-free .num.mine{display:none}
.maxed .num:not(.sel):not(.mine):not(.x){background:#eceff5;border-color:#e1e6ef;color:#b3bccd}
.gridbox{max-height:58vh;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 3px;border-radius:14px;background:#f6f8fc;border:1.5px solid var(--line)}
.num.flash{animation:flash .6s 3}
@keyframes flash{50%{transform:scale(1.15);box-shadow:0 0 0 4px var(--gold)}}
.num.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.num.flash,.num.shake,.num.win{animation:none}}
.num.sel{background:var(--gold);border-color:#e8a900;color:var(--navy);transform:scale(1.05);box-shadow:0 4px 12px rgba(255,200,61,.5)}
.num.mine{background:var(--navy);border-color:var(--navy);color:#fff}
.num.win{animation:pulse 1s infinite;background:var(--red);border-color:var(--red);color:#fff}
@keyframes pulse{50%{transform:scale(1.08)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:2px solid var(--line);background:#fff}

.pager{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pager select{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.pager button{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;font-size:18px;font-weight:800}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:10px;background:#fff}

/* FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fafbfe;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);background:#fff}
.detect{background:#f1f5fd;border:1.5px dashed #b9c7e3;border-radius:14px;padding:12px;margin-bottom:14px}
.detect label{display:block;font-size:12px;font-weight:700;color:var(--navy3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.detect textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);resize:vertical;font-size:16px}
.detect textarea:focus{outline:none;border-color:var(--navy3)}
.field input.filled{animation:filled 1.2s}
@keyframes filled{0%,40%{background:#e2f7ec;border-color:var(--green)}}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;background:#f1f4fa;border:2px solid transparent;font-weight:800;color:var(--navy);font-size:14px}
.seg button small{display:block;font-weight:500;font-size:10px;color:var(--muted)}
.seg button.on{border-color:var(--green);background:#e6f8ef}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(8,18,44,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet .handle{width:44px;height:5px;background:#dde3ee;border-radius:5px}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;margin:-8px -4px 10px}
.sheet-bar .sp{width:42px}
.backbtn{width:42px;height:42px;border-radius:13px;background:#eef2f9;color:var(--navy);font-size:22px;font-weight:800;display:grid;place-items:center;line-height:1}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;background:#f4f7fc;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--green);flex-shrink:0;margin-top:1px}
.sheet h2{margin-bottom:12px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

.big-num{font-size:54px;font-weight:900;color:var(--navy);text-align:center;letter-spacing:2px;line-height:1}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.r{background:#fff4e0;color:#b86a00}.pill.p{background:#e2f7ec;color:var(--green2)}.pill.d{background:#eef2f9;color:var(--muted)}

.plist .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.plist .it:last-child{border:none}
.plist .n{min-width:56px;height:40px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--green)}
.plist .n.r{background:var(--orange)}
.plist .who{flex:1;min-width:0}
.plist .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.boleta-prev{width:100%;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:block;margin-bottom:12px}

.linkbox{background:#f4f7fc;border:1.5px dashed #c7d2e6;border-radius:12px;padding:12px;font-size:12px;word-break:break-all;color:var(--navy3);max-height:90px;overflow:hidden;margin:10px 0}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%;text-align:center;animation:fade .2s}

/* CLIENTE */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 70px;text-align:center;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(31,191,106,.18)}
.hero:before{width:220px;height:220px;left:-80px;top:-80px}
.hero:after{width:160px;height:160px;right:-50px;bottom:-40px;background:rgba(255,200,61,.15)}
.hero .logo{font-weight:900;font-size:30px;position:relative;z-index:1}
.hero .logo b{color:var(--green)}
.hero h1{font-size:22px;font-weight:800;margin-top:10px;position:relative;z-index:1}
.hero .prize{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;padding:8px 16px;border-radius:24px;margin-top:10px;font-size:15px;position:relative;z-index:1}
.info-card{margin-top:-50px;position:relative;z-index:2}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-grid div{background:#f4f7fc;border-radius:12px;padding:10px}
.info-grid span{font-size:11px;color:var(--muted);display:block}
.info-grid b{font-size:14px}
.sticky-sel{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(11,31,75,.15);z-index:50;border-radius:22px 22px 0 0;animation:up .25s}
.sticky-sel .sel-nums{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;max-height:72px;overflow-y:auto}
.sticky-sel .sel-nums span{background:var(--gold);color:var(--navy);font-weight:800;padding:5px 10px;border-radius:10px;font-size:14px}
.success{text-align:center;padding:10px 0}
.success .ic{width:80px;height:80px;border-radius:50%;background:#e2f7ec;color:var(--green2);font-size:42px;display:grid;place-items:center;margin:0 auto 12px}
.note{background:#fff8e6;border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;font-size:12px;color:#7a5a00;margin-top:10px}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:16px 0 180px}

/* ===== v2.1 · Capa de diseño ===== */
:root{--bg:#f2f4f8;--ink:#0f1a3a;--soft:#f6f8fb;--line:#e5e9f1;--muted:#6a7590;--r:20px}
html,body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.logo,.big-num,.num,.disp{font-family:'Poppins','Inter',sans-serif}
h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
h3{font-size:15px;font-weight:700;letter-spacing:-.1px}
.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.ic.lg{width:22px;height:22px}
.btn{font-weight:600;letter-spacing:-.1px;border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.card{border-radius:var(--r);box-shadow:0 1px 2px rgba(15,26,58,.04),0 6px 20px rgba(15,26,58,.05);border:1px solid #edf0f5}

/* encabezado */
.top{background:radial-gradient(120% 140% at 100% 0%,#1d4597 0%,#0f2a63 45%,#0b1f4b 100%);padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 74px max(18px,env(safe-area-inset-left));border-radius:0 0 30px 30px}
.top:after{width:260px;height:260px;right:-90px;top:-110px;background:radial-gradient(circle,rgba(31,191,106,.28),rgba(31,191,106,0) 70%)}
.top:before{content:"";position:absolute;left:-70px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.16),rgba(255,200,61,0) 70%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2;min-height:42px}
.brand .logo{font-size:22px;font-weight:800}
.brand .tag{font-size:10px;padding:3px 8px;letter-spacing:1px}
.top .actions{position:static;display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;backdrop-filter:blur(6px)}
.iconbtn .ic{width:20px;height:20px}
.hello{position:relative;z-index:1;margin-top:18px}
.hello h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.15;text-wrap:balance}
.top .sub{font-size:13px;opacity:.72;margin-top:4px}
.ver{display:inline-block;margin-top:8px;font-size:10px;font-weight:600;opacity:.75;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:20px;letter-spacing:.4px}

/* resumen dentro del encabezado */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 10px 9px;min-width:0}
.kpi span{display:block;font-size:10.5px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* cápsulas */
.caps{display:flex;gap:6px;background:#fff;border-radius:18px;padding:5px;box-shadow:0 10px 30px rgba(15,26,58,.12);margin:-58px 0 16px;position:relative;z-index:3;border:1px solid #edf0f5}
.caps button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:14px;background:none;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.caps button .cnt{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#eef1f6;color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.caps button.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(15,26,58,.25)}
.caps button.on .cnt{background:var(--green);color:#fff}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.sec-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.sec-h span{font-size:12px;color:var(--muted)}

/* tarjeta de rifa */
.rc{display:block;width:100%;text-align:left;background:#fff;border:1px solid #edf0f5;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,26,58,.04),0 8px 22px rgba(15,26,58,.05);color:inherit;font:inherit;position:relative;overflow:hidden;transition:transform .12s}
.rc:active{transform:scale(.985)}
.rc:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tagc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.tagc.dig{background:#eef2fb;color:#1c3f8a}
.tagc.ok{background:#e3f6ec;color:#11804a}.tagc.ok:before{content:"";width:6px;height:6px;border-radius:50%;background:#1fbf6a;box-shadow:0 0 0 3px rgba(31,191,106,.18)}
.tagc.warn{background:#fff3df;color:#9a5a00}
.tagc.off{background:#eef0f4;color:#5b667f}
.tagc.win{background:#fff6d6;color:#8a6200}
.rc-chev{margin-left:auto;color:#b4bccb}
.rc h3{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.25;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .prize{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#11804a;font-weight:600;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.rc-meta span{display:inline-flex;align-items:center;gap:5px}
.rc-prog{display:flex;align-items:center;gap:10px}
.rc-prog .bar{flex:1;height:7px;background:#eef1f6;border-radius:8px;overflow:hidden}
.rc-prog .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#1fbf6a,#7dd99f)}
.rc-prog small{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc.done{background:linear-gradient(180deg,#fff,#fafbfd)}
.rc.done .rc-prog .bar i{background:#c3cad8}
.winbox{display:flex;align-items:center;gap:12px;background:#fff9e6;border:1px solid #fbe7ad;border-radius:16px;padding:10px 12px;margin-top:12px}
.winbox .wn{font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;background:#ffc83d;color:#0b1f4b;border-radius:11px;padding:4px 10px;letter-spacing:1px}
.winbox b{display:block;font-size:13.5px}.winbox span{font-size:12px;color:#7a5a00}

.empty{padding:36px 22px}
.empty .art{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,#e7f8ef,#eef2fb);display:grid;place-items:center;color:#1c3f8a}
.empty .art .ic{width:38px;height:38px}
.empty h2{margin-bottom:6px}

.fab{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:15px 22px 15px 18px;border-radius:20px;background:linear-gradient(180deg,#26c873,#17a85b);box-shadow:0 12px 28px rgba(23,168,91,.38),0 1px 0 rgba(255,255,255,.3) inset;right:max(18px,env(safe-area-inset-right))}
.fab .ic{width:20px;height:20px;stroke-width:2.5}

/* detalle */
.dhead{background:#fff;border:1px solid #edf0f5;border-radius:24px;padding:18px;margin:-58px 0 14px;position:relative;z-index:3;box-shadow:0 10px 30px rgba(15,26,58,.10)}
.dhead .rc-top{margin-bottom:8px}
.dhead h2{font-size:21px;letter-spacing:-.4px;line-height:1.2;text-wrap:balance}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.dgrid div{background:var(--soft);border-radius:14px;padding:10px;min-width:0}
.dgrid span{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.dgrid b{display:block;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dgrid .g b{color:#11804a}.dgrid .o b{color:#c27400}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tabs{background:#e8ecf3;border-radius:16px;padding:4px}
.tabs button{border-radius:12px;font-weight:600;font-size:13.5px}
.tabs button.on{color:var(--ink);box-shadow:0 2px 10px rgba(15,26,58,.08)}
.banner-off{display:flex;gap:12px;align-items:center;background:#eef0f4;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#3d4760}
.banner-off b{display:block;color:var(--ink)}
.banner-off .btn{margin-left:auto;flex-shrink:0}
.endbox{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}

/* ===== v2.3 ===== */
.rc{border:1.5px solid #d6dce8;box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(15,26,58,.06),0 10px 24px rgba(15,26,58,.08)}
.rc:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:#1fbf6a}
.rc.done:before{background:#e0b43a}
.num.has-n{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 4px;min-width:0;overflow:hidden}
.num.has-n .nk{font-size:15px;line-height:1}
.grid.c4 .num.has-n .nk{font-size:13px}
.num .nn{font-family:'Inter',system-ui,sans-serif;font-size:9.5px;font-weight:600;line-height:1.2;letter-spacing:0;width:100%;text-align:center;display:block}
.num .nn i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.c4 .num .nn{font-size:9px}.grid.c4 .num .nn i+i{display:none}
.num.r .nn{color:#8a4f00}.num.p .nn{color:#eafff2}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .15s,transform .1s}
button.kpi:active{transform:scale(.97)}
button.kpi:hover{background:rgba(255,255,255,.14)}
button.kpi span:after{content:" ›";opacity:.8}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;margin:0 -2px;padding:2px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid #e3e8f1;border-radius:16px;padding:10px 12px;font:inherit;color:inherit}

.mrow .mn{min-width:58px;height:42px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;color:#fff;background:#1fbf6a;font-variant-numeric:tabular-nums}
.mrow .mn.r{background:#ff9f1c}
.mrow .mw{flex:1;min-width:0}
.mrow .mw b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mw span{font-size:12.5px;color:var(--muted)}
.mtot{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.mtot b{font-family:'Poppins',sans-serif;font-size:16px;color:var(--ink)}

<script>
/* =========================================================
   RIFAS PRESTAYA  ·  v1.0
   ========================================================= */
const VERSION = 'v3.2';
const DEFAULT_WA = '573162685282';
const KEY = 'rifasPY_data_v1';
const KEY_CFG = 'rifasPY_cfg_v1';
const KEY_MINE = 'rifasPY_mine_v1';
const MAX_SEL = 20;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => '$' + Math.round(Number(v)||0).toLocaleString('es-CO');
const pad = (n, c) => String(n).padStart(c, '0');
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
const fmtFecha = f => { if(!f) return 'Por definir'; const d = new Date(f + 'T12:00:00'); return d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
const fmtFechaCorta = f => { if(!f) return 'Por definir'; const d = new Date(f + 'T12:00:00'); return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}); };
const waNum = t => { let d = String(t||'').replace(/\D/g, ''); if (d.length === 10 && d[0] === '3') d = '57' + d; return d; };
const ls = { get(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('No se pudo guardar (almacenamiento lleno)'); } } };

function toast(msg, ms = 2400){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function openURL(url){
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function openWA(phone, text){ openURL('https://wa.me/' + waNum(phone) + '?text=' + encodeURIComponent(text)); }
/* Confirmación propia (confirm/alert no funcionan en todos los navegadores) */
function askConfirm(msg, okText, onOk, danger = true){
  modal(`<div style="text-align:center;padding:6px 0 4px"><div style="font-size:44px">${danger ? '⚠️' : '❓'}</div>
    <p style="margin:10px 0 18px;font-size:15px;line-height:1.5">${msg}</p></div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn ${danger ? 'red' : ''}" id="cfOk">${okText}</button></div>`);
  $('#cfOk').onclick = () => { closeModal(); onOk(); };
}
function showMsg(msg){
  modal(`<div style="text-align:center;padding:6px 0 4px"><div style="font-size:44px">⚠️</div><p style="margin:10px 0 18px;font-size:15px;line-height:1.5">${msg}</p></div>
    <button class="btn block" onclick="closeModal()">Entendido</button>`);
}

/* ---------- Codificación del enlace ---------- */
function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDecode(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function bitsetEncode(nums, size){
  const bytes = new Uint8Array(Math.ceil(size / 8));
  nums.forEach(n => { n = +n; bytes[n >> 3] |= (1 << (n & 7)); });
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function bitsetDecode(b64, size){
  const set = new Set(); if (!b64) return set;
  let s = b64.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  const bin = atob(s);
  for (let i = 0; i < bin.length; i++){ const b = bin.charCodeAt(i); if (!b) continue; for (let j = 0; j < 8; j++) if (b & (1 << j)) { const n = i * 8 + j; if (n < size) set.add(n); } }
  return set;
}

/* =========================================================
   ADMIN
   ========================================================= */
let DB = ls.get(KEY, { rifas: [] });
let CFG = ls.get(KEY_CFG, { wa: DEFAULT_WA, org: 'PrestaYa' });
const save = () => ls.set(KEY, DB);
const saveCfg = () => ls.set(KEY_CFG, CFG);
const total = r => Math.pow(10, r.cifras);
const getRifa = id => DB.rifas.find(r => r.id === id);

const UI = { rifaId: null, tab: 'nums', filtro: 'todos', page: 0, q: '', live: false };

function stats(r){
  const vals = Object.values(r.nums || {});
  const p = vals.filter(v => v.e === 'p').length, a = vals.filter(v => v.e === 'r').length;
  const t = total(r);
  return { t, p, a, d: t - p - a, rec: p * r.precio, porCobrar: a * r.precio, pct: ((p + a) / t) * 100 };
}

const IC = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
/* Pasa al historial automáticamente: tiene número ganador y la fecha del sorteo ya llegó o pasó (sin fecha: basta el ganador) */
const enHistorial = r => r.ganador != null && (!r.fecha || r.fecha <= hoyISO());
function hoyISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function estadoRifa(r){
  if (enHistorial(r)) return ['win', 'Finalizada'];
  if (r.fecha){ const h = hoyISO(); if (r.fecha === h) return ['warn', 'Sorteo hoy']; if (r.fecha < h) return ['warn', 'Falta ganador']; }
  if (r.ganador != null) return ['win', 'Con ganador'];
  return ['ok', 'Activa'];
}
function setKpis(items){
  $('#topKpis').innerHTML = items.map(([l, v, fn]) => fn
    ? `<button type="button" class="kpi" onclick="${fn}" aria-label="Ver ${l.toLowerCase()}"><span>${l}</span><b>${v}</b></button>`
    : `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
}
function nombreCorto(n){ return String(n || '').trim().split(/\s+/).slice(0, 2).join(' '); }
function modalEstado(e){
  const r = getRifa(UI.rifaId); if (!r) return;
  const ks = Object.keys(r.nums).filter(k => r.nums[k].e === e).sort();
  const titulo = e === 'p' ? 'Números pagados' : 'Números apartados';
  const total = ks.length * (r.precio || 0);
  modal(`<h2>${titulo}</h2>
    <div class="mtot"><span>${ks.length} número${ks.length === 1 ? '' : 's'}${r.precio ? ' · ' + (e === 'p' ? 'recaudado' : 'por cobrar') : ''}</span><b>${r.precio ? money(total) : ks.length}</b></div>
    ${ks.length ? `<div class="mlist">${ks.map(k => { const v = r.nums[k]; return `
      <button type="button" class="mrow" onclick="modalNumero('${k}')">
        <span class="mn ${e}">${k}</span>
        <span class="mw"><b>${esc(v.n)}</b><span>${esc(v.t)}</span></span>
        ${IC('chev')}
      </button>`; }).join('')}</div>`
    : `<p class="muted" style="text-align:center;padding:24px 0">${e === 'p' ? 'Aún no hay números pagados.' : 'No hay números apartados pendientes de pago.'}</p>`}`);
}
function tarjetaRifa(r){
  const s = stats(r), [cls, txt] = estadoRifa(r);
  const win = r.ganador != null ? pad(r.ganador, r.cifras) : null, wv = win ? r.nums[win] : null;
  return `<button type="button" class="rc ${enHistorial(r) ? 'done' : ''}" onclick="abrirRifa('${r.id}')">
    <div class="rc-top"><span class="tagc dig">${r.cifras} cifras</span><span class="tagc ${cls}">${txt}</span><span class="rc-chev">${IC('chev')}</span></div>
    <h3>${esc(r.nombre)}</h3>
    <div class="prize">${IC('trophy', 'sm')}${esc(r.premio || 'Sin premio definido')}</div>
    <div class="rc-meta">
      <span>${IC('cal', 'sm')}${fmtFechaCorta(r.fecha)}</span>
      <span>${IC('users', 'sm')}${s.p + s.a} participante${s.p + s.a === 1 ? '' : 's'}</span>
      ${r.max ? `<span>${IC('ticket', 'sm')}${r.max} oport.</span>` : ''}
    </div>
    <div class="rc-prog"><div class="bar"><i style="width:${Math.max(s.pct, s.pct ? 2 : 0)}%"></i></div><small>${(s.p + s.a).toLocaleString('es-CO')} / ${s.t.toLocaleString('es-CO')}</small></div>
    ${win ? `<div class="winbox"><span class="wn">${win}</span><div><b>${wv ? esc(wv.n) : 'Número sin vender'}</b><span>Número ganador</span></div></div>` : ''}
  </button>`;
}
function renderLista(){
  $('#vLista').classList.remove('hidden'); $('#vDetalle').classList.add('hidden'); $('#btnBack').classList.add('hidden'); UI.rifaId = null;
  UI.lista = UI.lista || 'act';
  const act = DB.rifas.filter(r => !enHistorial(r)), his = DB.rifas.filter(enHistorial);
  const hist = UI.lista === 'his';
  $('#fabNew').classList.toggle('hidden', hist);
  $('#topTitle').textContent = hist ? 'Historial de rifas' : 'Mis rifas';
  $('#topSub').textContent = hist ? 'Rifas finalizadas y sus ganadores' : 'Crea, administra y comparte tus rifas';
  const lista = (hist ? his : act).slice().sort((a, b) => hist ? String(b.fecha || '').localeCompare(String(a.fecha || '')) : (b.creada || 0) - (a.creada || 0));
  const tot = lista.reduce((a, r) => { const s = stats(r); a.p += s.p + s.a; a.rec += s.rec; return a; }, { p: 0, rec: 0 });
  setKpis(hist
    ? [['Finalizadas', his.length], ['Con ganador', his.filter(r => r.ganador != null).length], ['Participantes', tot.p.toLocaleString('es-CO')]]
    : [['Activas', act.length], ['Participantes', tot.p.toLocaleString('es-CO')], ['Recaudado', money(tot.rec)]]);
  const caps = `<div class="caps" role="tablist">
    <button type="button" role="tab" aria-selected="${!hist}" class="${!hist ? 'on' : ''}" onclick="UI.lista='act';renderLista()">Rifas activas <span class="cnt">${act.length}</span></button>

function scrollToNum(box, k){

}

/* ---------- Conexión en vivo (Firebase Realtime Database, opcional) ---------- */
const fbBase = () => (CFG.fb || '').trim().replace(/\/+$/, '');
async function fbReq(base, path, method = 'GET', body){
  const r = await fetch(base + path + '.json', { method, cache: 'no-store', body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const fbVal = v => ({ n: v.n, t: v.t, e: v.e, f: v.f || Date.now(), tk: v.tk || '' });
function fbPushNum(r, k){
  if (!fbBase()) return; const v = r.nums[k];
  (v ? fbReq(fbBase(), `/rifasPY/${r.id}/nums/n${k}`, 'PUT', fbVal(v)) : fbReq(fbBase(), `/rifasPY/${r.id}/nums/n${k}`, 'DELETE')).catch(() => toast('Sin conexión: el cambio se enviará al sincronizar'));
}
let _syncing = false;
async function syncAdmin(r, rerender){
  if (!fbBase() || !r || _syncing) return; _syncing = true;
  try{
    const remote = await fbReq(fbBase(), `/rifasPY/${r.id}/nums`) || {};
    const nuevos = [];
    Object.entries(remote).forEach(([rk, v]) => {
      const k = rk.replace(/^n/, '');
      if (!r.nums[k] && v && v.n){ r.nums[k] = { n: v.n, t: v.t, e: 'r', f: v.f || Date.now(), cod: 'PY-' + uid().toUpperCase().slice(0, 6), tk: v.tk || nuevoTurno(), web: 1 }; nuevos.push(k); }
    });
    const subir = {}; Object.entries(r.nums).forEach(([k, v]) => subir['n' + k] = fbVal(v));
    if (Object.keys(subir).length) await fbReq(fbBase(), `/rifasPY/${r.id}/nums`, 'PATCH', subir);
    UI.live = true;
    if (nuevos.length){
      save(); if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      toast(`🔔 Nueva reserva: ${nuevos.join(', ')} · ${r.nums[nuevos[0]].n}`, 4000);
      if (rerender && !$('#modalRoot .modal') && UI.rifaId === r.id) renderDetalle();
    }
    const l = $('#admLive'); if (l) l.textContent = '🟢 En vivo';
  }catch(e){ UI.live = false; const l = $('#admLive'); if (l) l.textContent = '🔴 Sin conexión'; }
  finally{ _syncing = false; }
}
async function syncTodas(){ for (const r of DB.rifas) await syncAdmin(r, false); if (!$('#vLista').classList.contains('hidden')) renderLista(); }
setInterval(() => {
  if (document.hidden || !fbBase() || PREVIEW) return;
  if (UI.rifaId && !$('#vDetalle').classList.contains('hidden')) syncAdmin(getRifa(UI.rifaId), true);
}, 10000);

}
function closeModal(){ const m = $('#modalRoot .modal'); if (m){ m._onClose && m._onClose(); m.remove(); } if (!$('#modalRoot .modal')) document.documentElement.classList.remove('lock'); }

const nuevoTurno = () => Math.random().toString(36).slice(2, 6);
/* Números del mismo turno (misma participación). Datos antiguos sin turno: se agrupan por teléfono. */
function grupoCliente(r, k){
  const v = r.nums[k]; if (!v) return [k];
  if (v.tk) return Object.keys(r.nums).filter(x => r.nums[x].tk === v.tk).sort();
  const t = waNum(v.t); return Object.keys(r.nums).filter(x => !r.nums[x].tk && waNum(r.nums[x].t) === t).sort();
}

/* ---------- Detectar nombre y teléfono en un texto pegado ---------- */
function detectarDatos(txt){
  const t = String(txt || '').replace(/\r/g, '').replace(/\*/g, '');
  // Teléfono: primero celular colombiano (3xx xxx xxxx, con o sin +57), luego cualquier número de 7 a 12 dígitos
  let tel = '';
  const cel = t.match(/(?:\+?\s*57[\s.-]*)?(3\d{2})[\s.-]*(\d{3})[\s.-]*(\d{4})(?!\d)/);
  if (cel) tel = cel[1] + cel[2] + cel[3];
  else { const any = t.match(/(?:\+?\d[\d\s.-]{6,16}\d)/); if (any){ const d = any[0].replace(/\D/g, ''); if (d.length >= 7 && d.length <= 12) tel = d.replace(/^57(?=3\d{9}$)/, ''); } }
  // Nombre: línea con etiqueta "Nombre/Cliente", o la primera línea que tenga solo letras
  let nom = '';
  const lab = t.match(/(?:nombre(?:\s+completo)?|cliente|name)\s*[:=\-]\s*([^\n]+)/i);
  if (lab) nom = lab[1].split(/[,;|]|\s(?:tel[ée]?f?o?n?o?|cel(?:ular)?|whats(?:app)?|n[úu]mero|cc|c[ée]dula)\b/i)[0];
  else {
    const omitir = /^(rifa|n[úu]mero|tel[ée]fono|cel(ular)?|whatsapp|valor|premio|fecha|nueva reserva|hola|buen[oa]s|c[ée]dula|cc|direcci[óo]n|correo|email)\b/i;
    const lineas = t.split('\n').map(l => l.trim()).filter(Boolean);
    for (const l of lineas){
      if (omitir.test(l.replace(/^[^\wÀ-ÿ]+/, ''))) continue;
      const limpio = l.replace(/(?:\+?\s*57[\s.-]*)?3\d{2}[\s.-]*\d{3}[\s.-]*\d{4}/g, '').replace(/[^A-Za-zÀ-ÿñÑ\s]/g, ' ').replace(/\s+/g, ' ').trim();
      if (limpio.split(' ').filter(w => w.length > 1).length >= 1 && limpio.length >= 3){ nom = limpio; break; }
    }
  }
  nom = nom.replace(/[^A-Za-zÀ-ÿñÑ\s'.]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 50)
    .toLowerCase().replace(/(^|\s)([a-zà-ÿñ])/g, (m, a, b) => a + b.toUpperCase());
  return { n: nom, t: tel };
}

}

const cMax = () => C.m || MAX_SEL;
const cUsados = () => cMine().length + CSEL.size;
const mineKey = () => C.i + (C.tk ? ':' + C.tk : '');
function cMine(){ return PREVIEW ? [] : (minesGet()[mineKey()] || []); }
function cellCls(k, mineSet){ return mineSet.has(k) ? 'mine' : cTaken(k) ? 'x' : CSEL.has(k) ? 'sel' : ''; }
function updateCell(k){
  const b = document.querySelector(`#cGrid [data-k="${k}"]`); if (!b) return;
  b.className = 'num ' + cellCls(k, new Set(cMine()));
}
function updateCount(){
  const el = $('#cDisp'); if (el) el.textContent = `${(C.size - C.taken.size).toLocaleString('es-CO')} de ${C.size.toLocaleString('es-CO')}`;
}
function setLive(on){ const el = $('#cLive'); if (el) el.innerHTML = on ? '🟢 Disponibilidad en tiempo real' : '⚪ Verificando disponibilidad…'; }

async function syncCliente(){
  try{
    const d = await fetch(`${C.u}/rifasPY/${C.i}/nums.json?shallow=true`, { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); });
    const remote = new Set(Object.keys(d || {}).map(k => +k.replace(/^n/, '')));
    cMine().forEach(k => remote.add(+k));
    const cambiados = [];
    remote.forEach(n => { if (!C.taken.has(n)) cambiados.push(n); });
    C.taken.forEach(n => { if (!remote.has(n)) cambiados.push(n); });
    C.taken = remote;
    cambiados.forEach(n => {
      const k = pad(n, C.c);
      if (CSEL.has(k) && C.taken.has(n)){ CSEL.delete(k); toast(`⛔ El número ${k} lo acaba de apartar otra persona`, 3500); }
      updateCell(k);
    });
    if (cambiados.length){ updateCount(); renderSelBar(); }
    setLive(true);
  }catch(e){ setLive(false); }
}

function renderCliente(){
  const mineSet = new Set(cMine());
  let cells = '';
  for (let i = 0; i < C.size; i++){ const k = pad(i, C.c); cells += `<button class="num ${cellCls(k, mineSet)}" data-k="${k}">${k}</button>`; }
  $('#cliente').innerHTML = `
    ${PREVIEW ? `<div style="position:sticky;top:0;z-index:60;background:#ffc83d;color:#0b1f4b;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:13px">👁️ Vista previa del cliente<button class="btn navy sm" onclick="salirPreview()">← Volver al panel</button></div>` : ''}
    <section class="hero">
      <div class="logo">Presta<b>Ya</b></div>
      <div style="font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:700;position:relative;z-index:1">R I F A S</div>
      <h1>${esc(C.n)}</h1>
      ${C.p ? `<div class="prize">🏆 ${esc(C.p)}</div>` : ''}
    </section>
    <main class="wrap">
      <div class="card info-card">
        <div class="info-grid">
          <div><span>💵 Valor boleta</span><b>${C.v ? money(C.v) : 'Gratis'}</b></div>
          <div><span>📅 Fecha sorteo</span><b>${fmtFechaCorta(C.f)}</b></div>
          <div><span>🎲 Juega con</span><b>${esc(C.l || 'Por definir')}</b></div>
          <div><span>🎁 Participación</span><b>Gratuita</b></div>
        </div>
        ${C.m ? `<p style="margin-top:12px;font-size:13px;font-weight:600;color:var(--navy3)">🎟️ Tienes ${C.m} oportunidad${C.m > 1 ? 'es' : ''}: elige ${C.m === 1 ? 'tu número' : C.m + ' números'}</p>` : ''}
        ${C.d ? `<p class="muted" style="margin-top:12px">📌 ${esc(C.d)}</p>` : ''}
        ${C.u && !PREVIEW ? `<p class="muted" id="cLive" style="margin-top:10px;font-size:12px">⚪ Verificando disponibilidad…</p>` : ''}
      </div>
      ${mineSet.size ? `<div class="card" style="background:#0b1f4b;color:#fff"><h3>⭐ Tus números reservados</h3><p style="font-size:22px;font-weight:800;letter-spacing:1px;margin-top:4px">${[...mineSet].join(' · ')}</p><p style="font-size:12px;opacity:.75;margin-top:4px">Pendientes de confirmación de pago por PrestaYa.</p></div>` : ''}
      <div class="card">
        <h3>👇 Elige tu número favorito</h3>
        <p class="muted" style="margin-bottom:12px">Desliza el panel para ver todos los números. Toca ${C.m === 1 ? 'tu número' : C.m ? 'tus ' + C.m + ' números' : 'uno o varios'} y luego <b>Continuar</b>.</p>
        <div class="gridbox" id="cBox"><div class="grid c${C.c}" id="cGrid">${cells}</div></div>
      </div>
      <div class="foot">Rifas PrestaYa · ${VERSION}<br>Tus datos se envían únicamente al WhatsApp de PrestaYa.</div>
    </main>
    <div id="selBar"></div>`;
  updateCount(); renderSelBar(); if (C.u && !PREVIEW) syncCliente();
  $('#cGrid').onclick = e => { const b = e.target.closest('.num'); if (b) cToggle(b.dataset.k, b); };
}
function renderSelBar(){
  const el = $('#selBar'); if (!el) return;
  const g = $('#cGrid'); if (g) g.classList.toggle('maxed', !!C.m && cUsados() >= cMax());
  el.innerHTML = CSEL.size ? `<div class="sticky-sel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${C.m ? cUsados() + ' de ' + C.m + ' oportunidad' + (C.m > 1 ? 'es' : '') : CSEL.size + ' número' + (CSEL.size > 1 ? 's' : '')}${C.v ? ' · ' + money(C.v * CSEL.size) : ''}</b><button class="btn ghost sm" onclick="cLimpiar()">Limpiar</button></div>
      <div class="sel-nums">${[...CSEL].sort().map(k => `<span>${k}</span>`).join('')}</div>
      ${!C.m || cUsados() >= cMax() ? `<button class="btn block" onclick="cForm()">Continuar ➜</button>`
        : `<p class="muted" style="text-align:center;font-size:13px;font-weight:600;padding:6px 0 2px">Elige ${cMax() - cUsados()} número${cMax() - cUsados() > 1 ? 's' : ''} más para continuar</p>`}
    </div>` : '';
}
function cLimpiar(){ const ks = [...CSEL]; CSEL.clear(); ks.forEach(updateCell); renderSelBar(); }
function cSolo(on){
  $('#cGrid').classList.toggle('only-free', on);
  $('#chTodos').classList.toggle('on', !on); $('#chLibres').classList.toggle('on', on);
  $('#cBox').scrollTop = 0;
}
function shake(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function cToggle(k, b){
  if (cMine().includes(k)){ shake(b); return toast(`⭐ El número ${k} ya es tuyo`); }
  if (cTaken(k)){
    shake(b); if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
    return toast(`⛔ El número ${k} ya fue elegido. No disponible, elige otro.`, 2800);
  }
  if (CSEL.has(k)) CSEL.delete(k);
  else {
    if (cUsados() >= cMax()){ shake(b); return toast(C.m ? `🎟️ Ya usaste ${C.m === 1 ? 'tu oportunidad' : 'tus ' + C.m + ' oportunidades'}. No puedes elegir más números.` : `Máximo ${MAX_SEL} números por reserva`, 3000); }
    CSEL.add(k); if (navigator.vibrate) navigator.vibrate(15);
    if (C.m && cUsados() >= cMax()) toast(`✅ Completaste ${C.m === 1 ? 'tu oportunidad' : 'tus ' + C.m + ' oportunidades'}. Toca Continuar.`);
  }
  updateCell(k); renderSelBar();
}
function cIr(){
  const v = $('#cGo').value.replace(/\D/g, '');
  if (!v || v.length > C.c) return toast(`Escribe un número de hasta ${C.c} cifras`);
  const k = pad(v, C.c);
  if (cTaken(k) || cMine().includes(k)){ cSolo(false); toast(`⛔ El número ${k} no está disponible`); }
  setTimeout(() => scrollToNum($('#cBox'), k), 30);
}
function cAzar(){
  const mineSet = new Set(cMine());
  if (cUsados() >= cMax()) return toast(C.m ? `Ya elegiste el máximo de ${C.m} número${C.m > 1 ? 's' : ''}` : 'Máximo de números alcanzado');
  if (C.size - C.taken.size - CSEL.size <= 0) return toast('No quedan números disponibles');
  let k, tries = 0;
  do { k = pad(Math.floor(Math.random() * C.size), C.c); tries++; } while ((cTaken(k) || CSEL.has(k) || mineSet.has(k)) && tries < 50000);
  CSEL.add(k); updateCell(k); renderSelBar();
  setTimeout(() => scrollToNum($('#cBox'), k), 30); toast('🎲 Te salió el ' + k);
}
function cForm(){
  if (C.m && cUsados() < cMax()) return toast(`Elige ${cMax() - cUsados()} número${cMax() - cUsados() > 1 ? 's' : ''} más`);
  const nums = [...CSEL].sort();
  const prev = ls.get('rifasPY_cliente', {});
  modal(`
    <h2>📝 Tus datos</h2>
    <div style="background:#f4f7fc;border-radius:14px;padding:12px;margin-bottom:14px">
      <div class="muted">${esc(C.n)}</div>
      <div style="font-size:24px;font-weight:900;color:var(--navy);letter-spacing:1px">${nums.join(' · ')}</div>
      ${C.v ? `<div class="muted">Total: <b style="color:var(--green2)">${money(C.v * nums.length)}</b></div>` : ''}
    </div>
    <div class="field"><label for="cNom">Nombre completo</label><input id="cNom" maxlength="50" autocomplete="name" placeholder="Tu nombre y apellido" value="${esc(prev.n || '')}"></div>
    <div class="field"><label for="cTel">Teléfono / WhatsApp</label><input id="cTel" inputmode="tel" maxlength="13" autocomplete="tel" placeholder="3001234567" value="${esc(prev.t || '')}"></div>
    <button class="btn wa block" id="cSend" style="padding:16px;font-size:16px" onclick="cEnviar()">${WA_SVG} Enviar a WhatsApp</button>
    <p class="muted" style="font-size:11px;margin-top:10px;text-align:center">Tu número queda apartado y bloqueado para los demás. PrestaYa confirmará tu pago y te enviará tu boleta.</p>
    ${C.g ? `<div class="note">💳 Medios de pago: <b>${esc(C.g)}</b></div>` : ''}
  `);
}
const WA_SVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>`;

async function cEnviar(){
  const n = $('#cNom').value.trim().replace(/[|#]/g, ''); const t = $('#cTel').value.replace(/\D/g, '');
  if (n.length < 3) return toast('Escribe tu nombre completo');
  if (t.length < 10) return toast('Escribe un teléfono de 10 dígitos');
  const nums = [...CSEL].sort();
  ls.set('rifasPY_cliente', { n, t });
  const live = C.u && !PREVIEW;
  if (live){
    const btn = $('#cSend'); btn.disabled = true; btn.textContent = 'Apartando tus números…';
    try{
      const d = await fetch(`${C.u}/rifasPY/${C.i}/nums.json`, { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); }) || {};
      if (C.m){
        const tiene = Object.values(d).filter(v => v && (C.tk ? v.tk === C.tk : waNum(v.t) === waNum(t))).length;
        if (tiene + nums.length > C.m){ closeModal(); return showMsg(`Ya usaste las oportunidades de este enlace (<b>${C.m}</b>). Pide a PrestaYa un enlace nuevo para volver a participar.`); }
      }
      const ocup = nums.filter(k => d['n' + k]);
      if (ocup.length){
        ocup.forEach(k => { CSEL.delete(k); C.taken.add(+k); updateCell(k); }); updateCount(); renderSelBar();
        return showMsg(`⛔ Lo sentimos, ${ocup.length > 1 ? 'los números' : 'el número'} <b>${ocup.join(', ')}</b> ya ${ocup.length > 1 ? 'fueron apartados' : 'fue apartado'} por otra persona hace un momento.<br><br>${CSEL.size ? 'Tus otros números siguen seleccionados.' : 'Elige otro número.'}`);
      }
      const turno = C.tk || nuevoTurno(); const body = {}; nums.forEach(k => body['n' + k] = { n, t, e: 'r', f: Date.now(), tk: turno });
      await fetch(`${C.u}/rifasPY/${C.i}/nums.json`, { method: 'PATCH', body: JSON.stringify(body) });
    }catch(e){ /* sin conexión: la reserva sigue por WhatsApp */ }
  }
  if (PREVIEW && C.m){
    const r = getRifa(C.i); const tiene = r ? Object.values(r.nums).filter(v => C.tk ? v.tk === C.tk : waNum(v.t) === waNum(t)).length : 0;
    if (tiene + nums.length > C.m){ closeModal(); return showMsg(`Ya usaste las oportunidades de este enlace (<b>${C.m}</b>). Pide a PrestaYa un enlace nuevo para volver a participar.`); }
  }
  if (PREVIEW){
    // En la vista previa se simula la reserva en vivo: queda registrada en el panel
    const r = getRifa(C.i);
    if (r){ const turno = C.tk || nuevoTurno(); nums.forEach(k => { if (!r.nums[k]) r.nums[k] = { n, t, e: 'r', f: Date.now(), cod: 'PY-' + uid().toUpperCase().slice(0, 6), tk: turno, web: 1 }; }); save(); }
  } else {
    const m = minesGet(), mk = mineKey(); m[mk] = [...new Set([...(m[mk] || []), ...nums])].sort(); ls.set(KEY_MINE, m);
  }
  nums.forEach(k => C.taken.add(+k));
  CSEL.clear(); nums.forEach(updateCell); renderSelBar();
  const msg = `🎟️ *NUEVA RESERVA - RIFA PRESTAYA*\n\n*Rifa:* ${C.n}\n*Número(s):* ${nums.join(', ')}\n*Nombre:* ${n}\n*Teléfono:* ${t}${C.v ? '\n*Valor:* ' + money(C.v * nums.length) : ''}`;
  const waUrl = 'https://wa.me/' + waNum(C.w || DEFAULT_WA) + '?text=' + encodeURIComponent(msg);
  if (!live) openURL(waUrl);
  modal(`<div class="success"><div class="ic">✓</div><h2>¡Apartado, ${esc(n.split(' ')[0])}!</h2>
    <p class="muted" style="margin:8px 0 6px">${nums.length > 1 ? 'Tus números' : 'Tu número'} <b style="color:var(--navy);font-size:18px">${nums.join(', ')}</b> ya ${nums.length > 1 ? 'quedaron bloqueados' : 'quedó bloqueado'} para los demás.</p>
    <p class="muted" style="margin-bottom:14px">${live ? 'Ahora toca el botón para enviarnos tus datos por WhatsApp.' : 'Envía el mensaje que se abrió en WhatsApp.'} Cuando confirmemos tu pago recibirás tu boleta.</p>
    <a class="btn wa block" href="${waUrl}" target="_blank" rel="noopener">${WA_SVG} ${live ? 'Enviar a WhatsApp' : 'Abrir WhatsApp de nuevo'}</a>
    <button class="btn ghost block" style="margin-top:10px" onclick="closeModal()">Volver a la rifa</button></div>`, () => renderCliente());
}

/* =========================================================
   ARRANQUE
   ========================================================= */
function route(){
  const h = location.hash;
  if (h.startsWith('#r=')){ $('#admin').classList.add('hidden'); initCliente(h.slice(3)); }
  else if (h.startsWith('#f=')){ $('#admin').classList.add('hidden'); initClienteFB(h.slice(3)); }
  else if (h.startsWith('#-')){ $('#admin').classList.add('hidden'); initCliente(b64urlEncode(JSON.stringify(decodeShort(h.slice(2))))); }
  else if (h.startsWith('#=')){ $('#admin').classList.add('hidden'); initCliente(b64urlEncode(JSON.stringify(decodeCompact(h.slice(2))))); }
  else if (h.length > 2 && h.includes('~')){ $('#admin').classList.add('hidden'); initClienteFB(h.slice(1)); }
  else { $('#cliente').classList.add('hidden'); $('#admin').classList.remove('hidden'); $('#verTxt').textContent = VERSION; renderLista(); if (fbBase()) syncTodas(); }
}
window.addEventListener('hashchange', () => { closeModal(); route(); });
$('#fabNew').onclick = () => formRifa();
$('#btnMenu').onclick = modalAjustes;

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#btnInstall').classList.remove('hidden'); });
$('#btnInstall').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#btnInstall').classList.add('hidden'); };
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

route();
</script>
</body>
</html>
